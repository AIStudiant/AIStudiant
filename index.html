<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Studiant Pro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div id="authScreen" class="overlay">
        <div class="card">
            <div class="icon-lg">🎓</div>
            <h2>AI Studiant</h2>
            <input type="text" id="authInput" placeholder="Code (ADMIN ou USER1)">
            <button onclick="handleAuth()" class="btn-main">Se connecter</button>
        </div>
    </div>

    <div id="mainApp" style="display:none;">
        <header>
            <div class="user-card">
                <div class="avatar" id="uAvatar">?</div>
                <div>
                    <b id="uName">Utilisateur</b><br>
                    <small id="uTokens">0</small> <span class="gold">tokens</span>
                </div>
            </div>
            <div class="nav-btns">
                <button id="adminBtn" class="btn-warn" style="display:none;" onclick="showAdmin()">
                    <i class="fas fa-shield-alt"></i> <span id="badge" class="badge">0</span>
                </button>
                <button onclick="location.reload()" class="btn-icon"><i class="fas fa-power-off"></i></button>
            </div>
        </header>

        <div class="token-bar-container">
            <div id="tokenBar" class="token-bar"></div>
            <small id="tokenLabel">Stock IA: 100%</small>
        </div>

        <div class="actions">
            <span>Gratuit : <b id="uFree">0/3</b></span>
            <button onclick="showShop()" class="btn-buy">Acheter</button>
        </div>

        <div class="search-section">
            <input type="text" id="search" placeholder="Matière...">
            <button class="btn-add" onclick="addSubject()">+</button>
        </div>

        <div id="subjectList" class="grid"></div>
    </div>

    <div id="analysisModal" class="modal" style="display:none;">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">×</span>
            <h2 id="modalTitle">Matière</h2>
            <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
                <i class="fas fa-cloud-upload-alt"></i>
                <p>Uploader PDF / Word</p>
                <input type="file" id="fileInput" hidden onchange="handleFileUpload()">
            </div>
            <div id="fileInfo"></div>
            <button id="analyzeBtn" class="btn-main" style="display:none;" onclick="startAnalysis()">Analyser & Créer Quiz</button>
            <div id="results" style="display:none;">
                <div class="summary-box"><h3>Résumé</h3><p id="summaryText"></p></div>
                <div id="quizBox"></div>
            </div>
        </div>
    </div>

    <div id="shopModal" class="overlay" style="display:none;">
        <div class="card">
            <h3>Boutique Tokens</h3>
            <div class="pack" onclick="setPack(500000, 1000)">500k Tokens - 1000Ar</div>
            <div class="pack" onclick="setPack(1000000, 2000)">1M Tokens - 2000Ar</div>
            <select id="method"><option>MVola</option><option>Orange Money</option><option>Airtel</option></select>
            <input type="text" id="refId" placeholder="Réf. Transaction">
            <button id="sendBtn" class="btn-main" disabled onclick="sendReq()">Envoyer</button>
            <button onclick="closeShop()" class="btn-text">Annuler</button>
        </div>
    </div>

    <div id="adminModal" class="overlay" style="display:none;">
        <div class="card admin-card">
            <h3>Panel Admin</h3>
            <div class="stats">
                <div>Stock IA: <b id="aStock">1M</b></div>
                <div>Ventes: <b id="aSales">0</b> Ar</div>
            </div>
            <h4>Requêtes à valider</h4>
            <div id="reqList"></div>
            <button onclick="closeAdmin()" class="btn-main">Fermer</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
