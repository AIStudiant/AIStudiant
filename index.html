<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Studiant - Expert Analyse</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="profile">
                <div class="avatar">👨‍🎓</div>
                <span>Espace Éducatif</span>
            </div>
            <button class="add-btn">+</button>
        </header>

        <div class="search-bar">
            <input type="text" placeholder="Rechercher une matière...">
        </div>

        <main id="subject-list">
            <div class="card"><span>📐 Mathématiques</span><i class="fas fa-trash"></i></div>
            <div class="card"><span>⚛️ Physique</span><i class="fas fa-trash"></i></div>
        </main>

        <div class="actions">
            <label class="upload-area">
                <input type="file" id="fileInput" hidden>
                <i class="fas fa-cloud-upload-alt"></i>
                <span>Uploader un fichier</span>
            </label>
            <button id="analyzeBtn" class="main-btn">
                <i class="fas fa-brain"></i> Analyser les données
            </button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
