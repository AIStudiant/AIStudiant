<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Studiant - Expert Analyse</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="profile">
                <div class="avatar">👨‍🎓</div>
                <span>Espace Éducatif</span>
            </div>
            <button class="add-btn" id="addSubjectBtn">+</button>
        </header>

        <div class="search-bar">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Rechercher une matière...">
        </div>

        <main id="subject-list">
            </main>
    </div>

    <div id="analysisModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modalTitle">Matière</h2>
            <div class="modal-actions">
                <label class="upload-box">
                    <input type="file" id="modalFileInput" hidden>
                    <i class="fas fa-file-pdf"></i>
                    <p>Uploader PDF / Word</p>
                </label>
                <button id="modalAnalyzeBtn" class="main-btn">
                    <i class="fas fa-brain"></i> Analyser et Créer Quiz
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
