<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Studiant - Madagascar</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div id="authScreen" class="overlay">
        <div class="card">
            <h2>🎓 AI Studiant</h2>
            <p>Entrez votre code d'accès</p>
            <input type="text" id="authInput" placeholder="Ex: ADMIN ou USER1">
            <button onclick="handleAuth()" class="btn-main">Se connecter</button>
        </div>
    </div>

    <div id="mainApp" style="display:none;">
        <header>
            <div class="profile">
                <div class="avatar" id="uAvatar">?</div>
                <div>
                    <b id="uName">Utilisateur</b><br>
                    <span id="uTokens">0</span> <small>tokens</small>
                </div>
            </div>
            <button onclick="location.reload()" class="btn-icon"><i class="fas fa-power-off"></i></button>
        </header>

        <div class="stock-container">
            <div class="progress-bg"><div id="tokenBar" class="progress-fill"></div></div>
            <div class="flex-between">
                <small id="tokenLabel">Stock IA: 100%</small>
                <small>Gratuit: <b id="uFree">0/3</b></small>
            </div>
        </div>

        <div id="userTools">
            <div class="search-bar">
                <input type="text" placeholder="Rechercher une matière...">
                <button onclick="showShop()" class="btn-buy">Acheter Tokens</button>
            </div>
            <div id="subjectList" class="subjects-grid"></div>
        </div>
    </div>

    <div id="analysisModal" class="overlay-full" style="display:none;">
        <div class="analysis-content">
            <div class="header-modal">
                <h2 id="activeSubject">Matière</h2>
                <button onclick="closeAnalysis()">&times;</button>
            </div>
            
            <div id="uploadStep">
                <div class="upload-box" onclick="document.getElementById('fileInput').click()">
                    <i class="fas fa-file-upload"></i>
                    <p>Cliquez pour uploader (PDF, Image, Texte)</p>
                    <input type="file" id="fileInput" hidden onchange="onFileSelected()">
                </div>
                <div id="fileStatus" class="progress-text"></div>
                <button id="analyzeBtn" class="btn-main" style="display:none;" onclick="runAnalysis()">Lancer l'Analyse IA</button>
            </div>

            <div id="analysisResult" style="display:none;">
                <div class="result-box">
                    <h3>📝 Résumé</h3>
                    <div id="resText"></div>
                </div>
                <div class="result-box quiz-box">
                    <h3>❓ Quiz</h3>
                    <div id="quizContainer"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
