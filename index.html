<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Quiz Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎓 AI Quiz Generator</h1>
        
        <div id="login-section" class="card">
            <h3>Configuration</h3>
            <input type="password" id="api-key" placeholder="Insérez votre API Key Gemini ici...">
            <button onclick="saveConfig()">Accéder à l'application</button>
        </div>

        <div id="app-section" class="card hidden">
            <textarea id="input-text" placeholder="Collez le contenu de votre document ici..."></textarea>
            <button id="generate-btn" onclick="processContent()">Générer le Résumé & Quiz</button>

            <div id="loader" class="hidden">Analyse en cours par Gemini...</div>

            <div id="results">
                <section id="summary-area">
                    <h2>📝 Résumé Long</h2>
                    <div id="summary-content"></div>
                </section>

                <section id="quiz-area">
                    <h2>🧠 Quiz d'auto-évaluation</h2>
                    <div id="quiz-content"></div>
                </section>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
